spring:
  application:
    name: dak-backend
  profiles:
    active: dev
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE   # 05 API Spec 2.8: JSON fields use lower camel case
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-generation
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never      # never leak internal error detail; GlobalExceptionHandler owns the response body
    include-stacktrace: never

app:
  jwt:
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 14
  registration:
    # Open by default so a local checkout runs without configuration. The
    # production profile closes it — that is where getting this wrong has a
    # consequence.
    enabled: true
  rss:
    # Off until imports assign a category. Drafts without one cannot be
    # published, so polling only grows an unclearable backlog.
    polling-enabled: false
  site:
    # Used to build absolute URLs in the sitemap. No domain is registered yet;
    # this must be set to the real one before launch (D13).
    base-url: https://discoveradelaidekorea.au
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001
    enabled: true
  email:
    api-key: ${RESEND_API_KEY:}
    from: "DAK <noreply@send.discoveradelaidekorea.au>"
    reply-to: admin@discoveradelaidekorea.au
    # Off until two things exist: the reset screens, so the link in the message
    # leads somewhere, and a privacy policy clause naming Resend as a recipient
    # of email addresses. The endpoint answers 204 either way, so nothing about
    # the deployed behaviour changes when this flips — which is the point of
    # shipping it off rather than holding the code back.
    enabled: false